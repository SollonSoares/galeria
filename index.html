<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <link rel="stylesheet" href="https://sollonsoares.github.io/galeria/style.css?v=3">
</head>
<body>
    <main class="gallery-container">
        <h1>Galeria de Imagens</h1>

        <div class="carousel">
            <button class="carousel-btn prev" id="prevBtn" type="button">&#10094;</button>
            <div class="carousel-track-container">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>
            <button class="carousel-btn next" id="nextBtn" type="button">&#10095;</button>
        </div>

        <div class="address-section">
            <label for="imageAddress">Endereço da imagem atual</label>
            <input type="text" id="imageAddress" readonly>
            <button type="button" id="copyAddressBtn" class="upload-btn">Copiar endereço</button>
        </div>

        <div class="thumbnails-container" id="thumbnailsContainer"></div>
    </main>

    <script src="https://sollonsoares.github.io/galeria/script.js?v=3"></script>
</body>
</html>
