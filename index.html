<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="gallery-container">
        <h1>Galeria de Imagens</h1>
        
        <div class="carousel">
            <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
            <div class="carousel-track-container">
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide placeholder-slide">
                        <p>Nenhuma imagem selecionada</p>
                    </div>
                </div>
            </div>
            <button class="carousel-btn next" id="nextBtn">&#10095;</button>
        </div>

        <div class="address-section">
            <label for="imageAddress">Endereço da imagem atual</label>
            <input type="text" id="imageAddress" readonly>
            <button type="button" id="copyAddressBtn" class="upload-btn">Copiar endereço</button>
        </div>

        <div class="thumbnails-container" id="thumbnailsContainer"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
